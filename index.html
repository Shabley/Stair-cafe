<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>STAIR 스테어 커피</title>
<style>
/* ═══════════════════════════════════════════════════════════
   STAIR 스테어 커피 — 원두 큐레이션 & 주문 키오스크
   디자인 토큰 : 이 블록의 값만 바꾸면 전체 색/글꼴이 바뀝니다.
   ═══════════════════════════════════════════════════════════ */
:root{
  /* 색 — 따뜻한 카페 톤 */
  --paper:      #F2EADB;   /* 배경(종이) */
  --paper-2:    #E9DFCA;   /* 카드 배경 */
  --paper-3:    #FBF7F0;   /* 밝은 카드 */
  --ink:        #2A2118;   /* 본문 글자 (짙은 로스팅 브라운) */
  --ink-soft:   #6B5C4B;   /* 보조 글자 */
  --pine:       #1F3D31;   /* 짙은 상록 초록 — 구조/헤더 */
  --pine-soft:  #3C6151;   /* 초록 보조 */
  --amber:      #B0741C;   /* 강조 — 캐러멜 앰버 (가격/버튼) */
  --amber-deep: #8A5A13;
  --clay:       #8C5A3C;   /* 미디엄 로스트 브라운 */
  --line:       #CFC0A5;   /* 구분선 */
  --line-soft:  #E0D3B9;
  --danger:     #97402E;

  /* 글꼴 — 외부 폰트를 쓰지 않아 인터넷 없이도 동작합니다 */
  --f-display: "AppleMyungjo","Nanum Myeongjo","Noto Serif KR","Songti SC",serif;
  --f-body: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-num: ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* 간격 */
  --pad: 24px;
  --r: 4px;       /* 모서리 — 아날로그 메뉴판 느낌으로 거의 각지게 */
  --r-lg: 8px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ─── 공통 부품 ─────────────────────────────────────────── */
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.serif{font-family:var(--f-display)}
.eyebrow{
  font-family:var(--f-num);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-soft);
}
.hr{height:1px;background:var(--line);border:0;margin:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 22px;border-radius:var(--r);
  background:var(--pine);color:var(--paper-3);
  font-weight:600;letter-spacing:.01em;
  transition:background .15s;
}
.btn:active{background:var(--pine-soft)}
.btn.amber{background:var(--amber)}
.btn.amber:active{background:var(--amber-deep)}
.btn.ghost{background:transparent;color:var(--pine);border:1.5px solid var(--line)}
.btn.ghost:active{background:var(--paper-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.lg{padding:18px 34px;font-size:18px}
.btn.sm{padding:9px 14px;font-size:14px}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:100px;
  border:1.5px solid var(--line);background:transparent;
  font-size:14px;color:var(--ink-soft);
  transition:.12s;
}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--paper-3)}
.chip.note{border-style:dashed;color:var(--clay);border-color:var(--clay);pointer-events:none}

.tag-soldout{
  display:inline-block;padding:3px 9px;border-radius:2px;
  background:var(--danger);color:#fff;font-size:11px;letter-spacing:.08em;font-weight:700;
}

/* ─── 레이아웃 ──────────────────────────────────────────── */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:18px;
  padding:14px var(--pad);
  background:var(--pine);color:var(--paper-3);
  padding-top:calc(14px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;user-select:none}
.brand b{font-family:var(--f-num);font-size:21px;letter-spacing:.36em;font-weight:600}
.brand span{font-family:var(--f-display);font-size:13px;opacity:.72;letter-spacing:.12em}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.nav button{
  padding:9px 16px;border-radius:100px;font-size:15px;
  color:rgba(251,247,240,.72);transition:.12s;white-space:nowrap;
}
.nav button[aria-current="page"]{background:rgba(251,247,240,.14);color:var(--paper-3);font-weight:600}

main{flex:1;padding:var(--pad);padding-bottom:130px;max-width:1400px;width:100%;margin:0 auto}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h1.page{font-family:var(--f-display);font-size:34px;line-height:1.25;margin:6px 0 4px;font-weight:400;letter-spacing:-.01em}
p.page-sub{color:var(--ink-soft);margin:0 0 26px;font-size:15px}

/* ─── 홈 ────────────────────────────────────────────────── */
.hero{
  border:1.5px solid var(--line);border-radius:var(--r-lg);
  background:var(--paper-3);
  padding:34px 32px;margin-bottom:22px;
}
.hero .eyebrow{margin-bottom:14px}
.hero h2{
  font-family:var(--f-display);font-weight:400;
  font-size:clamp(24px,3.4vw,40px);line-height:1.4;margin:0;
  letter-spacing:-.015em;
}
.hero .sig{margin-top:20px;display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:14px}
.hero .sig::before{content:"";width:34px;height:1px;background:var(--clay)}

.home-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;align-items:start}
@media (max-width:900px){.home-grid{grid-template-columns:1fr}}

.pick{
  border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  background:var(--paper-3);cursor:pointer;text-align:left;width:100%;display:block;
}
.pick-top{background:var(--pine);color:var(--paper-3);padding:11px 20px;display:flex;justify-content:space-between;align-items:center}
.pick-top .eyebrow{color:rgba(251,247,240,.75)}
.pick-body{padding:24px 22px}
.pick-body h3{font-family:var(--f-display);font-weight:400;font-size:25px;margin:0 0 6px;line-height:1.35}
.pick-body .head{color:var(--clay);font-size:15px;margin:0 0 16px}

.info-card{border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--paper-3);padding:22px}
.info-card h4{margin:0 0 14px;font-size:14px;letter-spacing:.1em;color:var(--ink-soft);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line-soft);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--f-num);font-weight:600;letter-spacing:.04em}

.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:22px}
.quick button{
  border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper-3);
  padding:20px 16px;text-align:left;transition:.14s;
}
.quick button:active{background:var(--paper-2);transform:translateY(1px)}
.quick .q-t{font-family:var(--f-display);font-size:18px;display:block;margin-bottom:3px}
.quick .q-d{font-size:13px;color:var(--ink-soft)}

/* ─── 시그니처: 고도 계단 ───────────────────────────────── */
.stair-wrap{
  border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--paper-3);
  padding:22px 0 0;margin-bottom:24px;overflow:hidden;
}
.stair-head{padding:0 22px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.stair-head h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0}
.stair-head p{margin:4px 0 0;font-size:13.5px;color:var(--ink-soft);max-width:60ch}
.stair-scroll{
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  padding:0 22px 18px;
}
.stair{display:flex;align-items:flex-end;gap:3px;padding-top:8px}
.step{
  flex:0 0 152px;scroll-snap-align:center;
  display:flex;flex-direction:column;justify-content:flex-end;
  text-align:left;position:relative;
}
.step .bar{
  position:relative;width:100%;
  background:linear-gradient(180deg,var(--amber) 0%,rgba(176,116,28,.16) 100%);
  border-radius:2px 2px 0 0;transition:.16s;
}
.step .alt{
  position:absolute;top:-19px;left:0;
  font-family:var(--f-num);font-size:11.5px;color:var(--amber-deep);letter-spacing:.04em;white-space:nowrap;
}
.step .riser{
  border:1.5px solid var(--line);border-bottom:none;
  background:var(--paper-2);padding:13px 12px 15px;transition:.16s;
}
.step:active .riser{background:var(--paper)}
.step:active .bar{filter:brightness(1.12)}
.step .nm{font-family:var(--f-display);font-size:14.5px;line-height:1.42;display:block;height:4.26em;overflow:hidden;margin-bottom:9px}
.step .pr{font-family:var(--f-num);font-size:14px;font-weight:600}
.step .tread{height:8px;background:var(--pine)}
.step.off .riser,.step.off .bar{opacity:.4}
.stair-axis{
  display:flex;justify-content:space-between;padding:10px 22px 16px;
  border-top:1px solid var(--line-soft);
  font-family:var(--f-num);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;
}

/* ─── 원두 카드 그리드 ──────────────────────────────────── */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center}
.filters .lbl{font-size:12px;letter-spacing:.14em;color:var(--ink-soft);margin-right:4px;font-family:var(--f-num);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.bean-card{
  border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--paper-3);
  padding:20px;text-align:left;display:flex;flex-direction:column;gap:11px;
  transition:.14s;min-height:220px;
}
.bean-card:active{background:var(--paper-2);transform:translateY(1px)}
.bean-card.off{opacity:.5}
.bean-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bean-card .origin{font-family:var(--f-num);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
.bean-card h3{font-family:var(--f-display);font-weight:400;font-size:19.5px;margin:0;line-height:1.38}
.bean-card .head{font-size:14px;color:var(--clay);margin:0}
.bean-card .notes{font-size:13px;color:var(--ink-soft);margin-top:auto}
.bean-card .price{font-family:var(--f-num);font-size:17px;font-weight:600;white-space:nowrap}
.bars{display:flex;gap:3px;align-items:center}
.bars i{width:14px;height:5px;background:var(--line);border-radius:1px;display:block}
.bars i.on{background:var(--amber)}
.bars em{font-style:normal;font-size:11px;color:var(--ink-soft);margin-right:5px;font-family:var(--f-num);letter-spacing:.08em}

/* ─── 원두 상세 ─────────────────────────────────────────── */
.detail{display:grid;grid-template-columns:1.25fr .95fr;gap:26px;align-items:start}
@media (max-width:920px){.detail{grid-template-columns:1fr}}
.back{margin-bottom:16px;display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:15px}
.d-title{font-family:var(--f-display);font-weight:400;font-size:clamp(27px,3.6vw,42px);line-height:1.24;margin:0 0 10px;letter-spacing:-.015em}
.d-head{font-size:17px;color:var(--clay);margin:0 0 22px}
.meta{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:24px;
}
.meta div{background:var(--paper-3);padding:13px 14px}
.meta dt{font-family:var(--f-num);font-size:10.5px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:5px}
.meta dd{margin:0;font-size:15px;line-height:1.4}
.block{margin-bottom:26px}
.block h4{
  font-size:12px;letter-spacing:.18em;color:var(--ink-soft);font-family:var(--f-num);
  text-transform:uppercase;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line-soft);
}
.block p{margin:0 0 12px;font-size:16px;line-height:1.75}
.when{list-style:none;padding:0;margin:0}
.when li{padding:11px 0 11px 26px;border-bottom:1px dashed var(--line-soft);position:relative;font-size:15.5px}
.when li:last-child{border-bottom:0}
.when li::before{content:"";position:absolute;left:6px;top:19px;width:7px;height:7px;background:var(--amber);border-radius:50%}

.owner{
  border:1.5px solid var(--pine);border-radius:var(--r-lg);
  background:var(--pine);color:var(--paper-3);padding:24px 26px;margin-bottom:26px;
}
.owner .eyebrow{color:rgba(251,247,240,.7);margin-bottom:12px}
.owner p{font-family:var(--f-display);font-size:19px;line-height:1.7;margin:0;white-space:pre-wrap}
.owner .who{margin-top:14px;font-size:13px;opacity:.7;font-family:var(--f-body)}

.radar-card{border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--paper-3);padding:24px;margin-bottom:18px}
.radar-card h4{margin:0 0 4px;font-size:12px;letter-spacing:.18em;font-family:var(--f-num);color:var(--ink-soft);text-transform:uppercase}
.radar-card .cap{font-size:13px;color:var(--ink-soft);margin:0 0 10px}
svg.radar{display:block;width:100%;height:auto}

/* ─── 옵션 / 담기 ───────────────────────────────────────── */
.order-box{border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--paper-3);padding:22px;position:sticky;top:96px}
.opt{margin-bottom:18px}
.opt .lbl{font-family:var(--f-num);font-size:11px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase;display:block;margin-bottom:9px}
.opt-row{display:flex;gap:8px;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;width:fit-content}
.qty button{width:46px;height:46px;font-size:22px;background:var(--paper-2);color:var(--pine)}
.qty button:active{background:var(--line-soft)}
.qty span{width:56px;text-align:center;font-family:var(--f-num);font-size:18px;font-weight:600}
.total-line{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-top:1.5px solid var(--line);margin-top:6px}
.total-line b{font-family:var(--f-num);font-size:26px;font-weight:600}
.hint{font-size:13px;color:var(--ink-soft);margin:10px 0 0;line-height:1.6}

/* ─── 기타 메뉴 ─────────────────────────────────────────── */
.cat{margin-bottom:34px}
.cat h3{
  font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 4px;
  display:flex;align-items:center;gap:14px;
}
.cat h3::after{content:"";flex:1;height:1px;background:var(--line)}
.cat .cat-note{font-size:13px;color:var(--ink-soft);margin:0 0 16px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.item{
  border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper-3);
  padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;
  transition:.14s;
}
.item:active{background:var(--paper-2)}
.item.off{opacity:.5}
.item .nm{font-size:16.5px;display:block;margin-bottom:3px}
.item .ds{font-size:13px;color:var(--ink-soft)}
.item .pr{font-family:var(--f-num);font-size:16px;font-weight:600;white-space:nowrap}

/* ─── 장바구니 바 / 장바구니 ────────────────────────────── */
.cartbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--pine);color:var(--paper-3);
  padding:14px var(--pad);padding-bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:18px;
  transform:translateY(110%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
}
.cartbar.show{transform:none}
.cartbar .sum{display:flex;flex-direction:column;gap:2px}
.cartbar .sum .c{font-size:13px;opacity:.75}
.cartbar .sum .t{font-family:var(--f-num);font-size:24px;font-weight:600}
.cartbar .acts{margin-left:auto;display:flex;gap:10px}
.cartbar .btn{background:var(--amber)}
.cartbar .btn.ghost{background:transparent;border-color:rgba(251,247,240,.4);color:var(--paper-3)}

.cart-row{
  display:flex;gap:16px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--line-soft);
}
.cart-row .grow{flex:1;min-width:0}
.cart-row .nm{font-size:17px;margin-bottom:4px}
.cart-row .op{font-size:13.5px;color:var(--ink-soft)}
.cart-row .pr{font-family:var(--f-num);font-size:17px;font-weight:600;white-space:nowrap;text-align:right}
.cart-row .pr small{display:block;font-size:12px;font-weight:400;color:var(--amber-deep);letter-spacing:0}
.cart-empty{text-align:center;padding:80px 20px;color:var(--ink-soft)}
.cart-empty .big{font-family:var(--f-display);font-size:24px;color:var(--ink);margin-bottom:10px}
.sum-box{border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--paper-3);padding:22px;margin-top:22px}

/* ─── 주문 완료 ─────────────────────────────────────────── */
.ticket{
  max-width:520px;margin:0 auto;background:var(--paper-3);
  border:1.5px solid var(--line);border-radius:var(--r-lg);padding:34px;
}
.ticket .no{font-family:var(--f-num);font-size:58px;font-weight:600;letter-spacing:.06em;text-align:center;color:var(--pine);line-height:1.1}
.ticket .no-lbl{text-align:center;margin-bottom:22px}
.tr{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:15px;border-bottom:1px dashed var(--line-soft)}
.tr .op{font-size:12.5px;color:var(--ink-soft);display:block}

/* ─── 관리자 ────────────────────────────────────────────── */
.admin-note{
  border-left:4px solid var(--amber);background:var(--paper-2);
  padding:14px 18px;font-size:14px;margin-bottom:24px;border-radius:0 var(--r) var(--r) 0;line-height:1.65;
}
.a-sec{border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--paper-3);padding:22px;margin-bottom:18px}
.a-sec h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 4px}
.a-sec .sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 18px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600}
.fld input,.fld textarea,.fld select{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--paper);font-size:15px;line-height:1.6;
}
.fld textarea{min-height:86px;resize:vertical}
.a-row{
  display:grid;grid-template-columns:1fr 130px 96px;gap:12px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line-soft);
}
@media (max-width:640px){.a-row{grid-template-columns:1fr}}
.a-row .t{font-size:15px}
.a-row .t small{display:block;color:var(--ink-soft);font-size:12px}
.a-row input{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);font-family:var(--f-num);text-align:right}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}

/* ═══════════════════════════════════════════════════════════════════════
   ②  저 장 소  —  관리자 변경사항을 브라우저에 저장합니다.
   저장이 막힌 환경에서는 자동으로 메모리 저장으로 넘어갑니다(에러 없음).
   영구 보관은 관리자 → 설정 내보내기(JSON)를 이용하세요.
   ═══════════════════════════════════════════════════════════════════════ */
const KEY = "stair.cafe.v1";
const Store = (()=>{
  let mem = null, ok = true;
  try{ const t="__t"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t); }
  catch(e){ ok = false; }
  return {
    persistent: ok,
    load(){
      if(!ok) return mem;
      try{ const r = window.localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }
      catch(e){ return mem; }
    },
    save(o){
      mem = o;
      if(!ok) return false;
      try{ window.localStorage.setItem(KEY, JSON.stringify(o)); return true; }
      catch(e){ return false; }
    }
  };
})();

  const it = findAny(l.id); if(!it) return 0;
  let p = it.price;
  if(l.ice) p += MENU_DATA.options.icePrice;
  if(l.takeout) p -= MENU_DATA.options.takeoutDiscount;
  return p * l.qty;
}

/* 향미 레이더 차트 SVG */
function radarSVG(f){
  const ax=[["산미",f.acidity],["바디",f.body],["단맛",f.sweet],["향",f.aroma],["밸런스",f.balance]];
  const cx=150, cy=134, R=94, n=5;
  const pt=(i,r)=>{
    const a = -Math.PI/2 + i*2*Math.PI/n;
    return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];
  };
  let rings="";
  for(let k=1;k<=5;k++){
    const pts=[...Array(n)].map((_,i)=>pt(i,R*k/5).map(v=>v.toFixed(1)).join(",")).join(" ");
    rings+=`<polygon points="${pts}" style="fill:none;stroke:var(--line);stroke-width:${k===5?1.4:0.8}" ${k<5?'stroke-dasharray="2 3"':''}/>`;
  }
  let spokes="";
  for(let i=0;i<n;i++){ const [x,y]=pt(i,R); spokes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line);stroke-width:.8"/>`; }
  const shape=ax.map((a,i)=>pt(i,R*a[1]/5).map(v=>v.toFixed(1)).join(",")).join(" ");
  let dots="", labels="";
  ax.forEach((a,i)=>{
    const [px,py]=pt(i,R*a[1]/5);
    dots+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.4" style="fill:var(--amber)"/>`;
    const [lx,ly]=pt(i,R+24);
    labels+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" style="font-size:12.5px;fill:var(--ink-soft)">${a[0]}</text>`+
            `<text x="${lx.toFixed(1)}" y="${(ly+19).toFixed(1)}" text-anchor="middle" style="font-size:11px;fill:var(--amber-deep);font-family:var(--f-num)">${a[1]}</text>`;
  });
  return `<svg class="radar" viewBox="0 0 300 290" role="img" aria-label="향미 그래프">
    ${rings}${spokes}
    <polygon points="${shape}" style="fill:rgba(176,116,28,.20);stroke:var(--amber);stroke-width:2"/>
    ${dots}${labels}</svg>`;
}

/* 작은 막대 게이지 */
function bars(label,v){
  let h=`<div class="bars"><em>${label}</em>`;
  for(let i=1;i<=5;i++) h+=`<i class="${i<=v?'on':''}"></i>`;
  return h+"</div>";
}

  if(state.taste){ const t=TASTE.find(x=>x.k===state.taste); list = list.filter(t.fn); }

  const moodChips = MOOD.map(m=>`<button class="chip" data-mood="${m.k}" aria-pressed="${state.mood===m.k}">${m.t}</button>`).join("");
  const tasteChips= TASTE.map(t=>`<button class="chip" data-taste="${t.k}" aria-pressed="${state.taste===t.k}">${t.t}</button>`).join("");

  return `
  <h1 class="page">원두 고르기</h1>
  <p class="page-sub">이름이 길어 보이지만, 사실 <b>나라 · 지역 · 농장 · 품종 · 가공방식</b> 순서로 적혀 있습니다. 이름만 읽어도 맛이 짐작돼요.</p>

  <div class="filters"><span class="lbl">기분</span>${moodChips}</div>
  <div class="filters"><span class="lbl">맛</span>${tasteChips}
    <button class="chip" data-reset style="margin-left:auto">필터 해제</button>
    <button class="chip" data-toggleview>${state.stairView?"카드로 보기":"계단으로 보기"}</button>
  </div>

  ${state.stairView && !state.mood && !state.taste ? stairBlock() : ""}

  ${list.length===0
    ? `<div class="cart-empty"><div class="big">조건에 맞는 원두가 없어요</div><p>필터를 하나만 골라보세요.</p></div>`
    : `<div class="grid">${list.map(beanCard).join("")}</div>`}
  `;
}

/* 시그니처 — 고도 계단 */
function stairBlock(){
  const list = allBeans().slice().sort((a,b)=>a.altitude-b.altitude);
  const lo=1200, hi=2500, RISE=196;
  const steps = list.map(b=>{
    const h = Math.round((b.altitude-lo)/(hi-lo)*RISE)+26;
    return `<button class="step ${b.active?"":"off"}" data-bean="${b.id}" aria-label="${esc(b.name)}, 해발 ${b.altitude}미터, ${won(b.price)}">
      <div class="bar" style="height:${h}px"><span class="alt">${b.altitude.toLocaleString()}m</span></div>
      <div class="riser">
        <span class="nm">${esc(b.name)}</span>
        <span class="pr">${won(b.price)}</span>
        ${b.active?"":'<div style="margin-top:7px"><span class="tag-soldout">품절</span></div>'}
      </div>
      <div class="tread"></div>
    </button>`;
  }).join("");
  return `
  <div class="stair-wrap">
    <div class="stair-head">
      <div>
        <h3>고도 계단</h3>
        <p>왼쪽에서 오른쪽으로 갈수록 커피가 자란 땅이 높아집니다. 높이 올라갈수록 밤낮 기온차가 커져 열매가 천천히 익고, 그만큼 산미가 또렷하고 향이 촘촘해집니다.</p>
      </div>
      <span class="eyebrow">옆으로 넘겨보세요 →</span>
    </div>
    <div class="stair-scroll"><div class="stair">${steps}</div></div>
    <div class="stair-axis"><span>낮은 곳 · 순하고 달게</span><span>높은 곳 · 또렷하고 화사하게</span></div>
  </div>`;
}

function beanCard(b){
  return `<button class="bean-card ${b.active?"":"off"}" data-bean="${b.id}">
    <div class="row1">
      <span class="origin">${esc(b.country)} · ${esc(b.process)}</span>
      <span class="price">${won(b.price)}</span>
    </div>
    <h3>${esc(b.name)}</h3>
    <p class="head">${esc(b.headline)}</p>
    <div style="display:flex;flex-direction:column;gap:4px">
      ${bars("산미",b.flavor.acidity)}${bars("바디",b.flavor.body)}${bars("향 ",b.flavor.aroma)}
    </div>
    <div class="notes">${b.notes.slice(0,4).map(esc).join(" · ")}</div>
    ${b.active?"":'<div><span class="tag-soldout">품절</span></div>'}
  </button>`;
}

/* 주문 옵션 박스 (원두 상세 · 기타 메뉴 공용) */
function orderBox(it,d){
  if(!d) return "";
  const base = it.price;
  const unit = base + (d.ice?MENU_DATA.options.icePrice:0) - (d.takeout?MENU_DATA.options.takeoutDiscount:0);
  return `
  <div class="order-box">
    ${!it.active ? `<p class="hint" style="margin:0 0 14px"><span class="tag-soldout">품절</span> 오늘은 준비되지 않았습니다.</p>` : ""}

    ${it.choose ? `<div class="opt"><span class="lbl">${esc(it.choose.label)}</span>
      <div class="opt-row">${it.choose.options.map(o=>
        `<button class="chip" data-choose="${esc(o)}" aria-pressed="${d.choice===o}">${esc(o)}</button>`).join("")}</div></div>` : ""}

    ${it.ice ? `<div class="opt"><span class="lbl">온도</span>
      <div class="opt-row">
        <button class="chip" data-ice="0" aria-pressed="${!d.ice}">따뜻하게</button>
        <button class="chip" data-ice="1" aria-pressed="${d.ice}">차갑게 +${MENU_DATA.options.icePrice}</button>
      </div></div>` : ""}

    <div class="opt"><span class="lbl">드시는 곳</span>
      <div class="opt-row">
        <button class="chip" data-to="0" aria-pressed="${!d.takeout}">매장에서</button>
        <button class="chip" data-to="1" aria-pressed="${d.takeout}" ${it.takeout?"":'disabled style="opacity:.35"'}>
          테이크아웃 −${MENU_DATA.options.takeoutDiscount.toLocaleString()}</button>
      </div>
      ${it.takeout?"":`<p class="hint">이 메뉴는 테이크아웃이 되지 않습니다.</p>`}
    </div>

    <div class="opt"><span class="lbl">수량</span>
      <div class="qty">
        <button data-qty="-1" aria-label="수량 줄이기">−</button>
        <span>${d.qty}</span>
        <button data-qty="1" aria-label="수량 늘리기">+</button>
      </div>
    </div>

    <div class="total-line"><span>합계</span><b>${won(unit*d.qty)}</b></div>
    <button class="btn amber lg" style="width:100%" data-add ${it.active?"":"disabled"}>
      ${it.active?"주문표에 담기":"품절"}
    </button>
    ${it.choose && !d.choice ? `<p class="hint">${esc(it.choose.label)}을(를) 먼저 골라주세요.</p>` : ""}
  </div>`;
}

          <span class="ds">${i.desc?esc(i.desc):""}${i.choose?` · ${esc(i.choose.options.join(" / "))}`:""}</span></span>
        <span class="pr">${i.active?won(i.price):"품절"}</span>

    return `<section class="cat"><h3>${esc(c.cat)}</h3>
      ${c.note?`<p class="cat-note">${esc(c.note)}</p>`:""}
      <div class="list">${items}</div></section>`;

  return `

/* ── 주문표 ─────────────────────────────────────────────── */
function viewCart(){
  if(state.cart.length===0) return `
    <div class="cart-empty">
      <div class="big">아직 담긴 메뉴가 없습니다</div>
      <p style="margin-bottom:24px">원두를 먼저 골라보시겠어요?</p>
      <button class="btn" data-go="beans">원두 고르기</button>
    </div>`;

  const rows = state.cart.map((l,i)=>{
    const it=findAny(l.id);
    const opts=[];
    if(l.choice) opts.push(l.choice);
    if(it.ice) opts.push(l.ice?"차갑게":"따뜻하게");
    opts.push(l.takeout?"테이크아웃":"매장");
    return `<div class="cart-row">
      <div class="grow">
        <div class="nm">${esc(it.name)}</div>
        <div class="op">${opts.map(esc).join(" · ")}</div>
        <div class="qty" style="margin-top:10px">
          <button data-cq="${i}|-1" aria-label="수량 줄이기">−</button><span>${l.qty}</span>
          <button data-cq="${i}|1" aria-label="수량 늘리기">+</button>
        </div>
      </div>
      <div class="pr">${won(lineTotal(l))}
        ${l.ice?`<small>차가운 +${MENU_DATA.options.icePrice}</small>`:""}
        ${l.takeout?`<small>테이크아웃 −${MENU_DATA.options.takeoutDiscount.toLocaleString()}</small>`:""}
      </div>
      <button class="btn ghost sm" data-del="${i}">삭제</button>
    </div>`;
  }).join("");

  return `
  <h1 class="page">주문표</h1>
  <p class="page-sub">확인 후 아래 버튼을 누르고, 화면을 직원에게 보여주세요.</p>
  <div style="max-width:760px">
    ${rows}
    <div class="sum-box">
      <div class="kv" style="border:0"><span>총 ${cartCount()}개</span><b style="font-size:26px">${won(cartTotal())}</b></div>
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        <button class="btn amber lg" style="flex:1;min-width:200px" data-order>주문 확정하기</button>
        <button class="btn ghost lg" data-go="beans">더 담기</button>
      </div>
      <p class="hint">결제는 카운터에서 도와드립니다.</p>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   ⑥  이 벤 트
   ═══════════════════════════════════════════════════════════════════════ */
function go(v){ state.view=v; if(v!=="bean"&&v!=="menu") state.draft=null; render(); }

function newDraft(it){
  return { id:it.id, qty:1, ice:false, takeout:false,
           choice: it.choose ? null : undefined };
}

function bind(){
  const app=$("#app");

  /* 로고 5번 → 관리자 */
  const brand=$("#brand");
  if(brand) brand.onclick=()=>{
    state.logoTaps++;
    clearTimeout(state.logoTimer);
    state.logoTimer=setTimeout(()=>state.logoTaps=0,1200);
    if(state.logoTaps>=5){ state.logoTaps=0; state.view="admin"; render(); }
    else if(state.logoTaps===1){ go("home"); }
  };

  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  app.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{ state.cart=[]; render(); toast("주문표를 비웠습니다"); });

  app.querySelectorAll("[data-bean]").forEach(b=>b.onclick=()=>{
    state.beanId=b.dataset.bean; state.draft=newDraft(bean(b.dataset.bean)); go("bean");
  });
  app.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>{
    const it=findAny(b.dataset.item); state.draft=newDraft(it); render();
  });
  app.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{ state.draft=null; render(); });

  app.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>{
    state.mood = state.mood===b.dataset.mood ? null : b.dataset.mood;
    state.taste=null; go("beans");
  });
  app.querySelectorAll("[data-taste]").forEach(b=>b.onclick=()=>{
    state.taste = state.taste===b.dataset.taste ? null : b.dataset.taste; state.mood=null; render();
  });
  app.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{ state.mood=null;state.taste=null; render(); });
  app.querySelectorAll("[data-toggleview]").forEach(b=>b.onclick=()=>{ state.stairView=!state.stairView; render(); });

  /* 옵션 */
  const d=state.draft;
  app.querySelectorAll("[data-choose]").forEach(b=>b.onclick=()=>{ d.choice=b.dataset.choose; render(); });
  app.querySelectorAll("[data-ice]").forEach(b=>b.onclick=()=>{ d.ice=b.dataset.ice==="1"; render(); });
  app.querySelectorAll("[data-to]").forEach(b=>b.onclick=()=>{ d.takeout=b.dataset.to==="1"; render(); });
  app.querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>{
    d.qty=Math.max(1,Math.min(20,d.qty+Number(b.dataset.qty))); render();
  });
  app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    const it=findAny(d.id);
    if(it.choose && !d.choice){ toast(it.choose.label+"을(를) 골라주세요"); return; }
    const same=state.cart.find(l=>l.id===d.id&&l.ice===d.ice&&l.takeout===d.takeout&&l.choice===d.choice);
    if(same) same.qty+=d.qty; else state.cart.push(Object.assign({},d));
    state.draft = state.view==="bean" ? newDraft(it) : null;
    toast(it.name+" 담았습니다"); render();
  });

  /* 장바구니 */
  app.querySelectorAll("[data-cq]").forEach(b=>b.onclick=()=>{
    const [i,n]=b.dataset.cq.split("|").map(Number);
    state.cart[i].qty=Math.max(1,Math.min(20,state.cart[i].qty+n)); render();
  });
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    state.cart.splice(Number(b.dataset.del),1); render();
  });
  app.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>{
    state.order={ no:String(Math.floor(Math.random()*900)+100), lines:state.cart.slice(), total:cartTotal() };
    state.cart=[]; go("done");
  });
  app.querySelectorAll("[data-neworder]").forEach(b=>b.onclick=()=>{ state.order=null; go("home"); });

  /* 관리자 */
  app.querySelectorAll("[data-pinok]").forEach(b=>b.onclick=()=>{
    if($("#pin").value===S.pin){ state.adminOK=true; render(); }
    else toast("PIN이 맞지 않습니다");
  });
  const pin=$("#pin"); if(pin){ pin.focus(); pin.onkeydown=e=>{ if(e.key==="Enter") app.querySelector("[data-pinok]").click(); }; }

  app.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{
    S.banner=$("#a-banner").value;
    S.todayPick=$("#a-pick").value;
    S.idleReset=$("#a-idle").checked;
    S.idleSec=Math.max(30,Number($("#a-idlesec").value)||150);
    S.pin=($("#a-pin").value||"2025").trim();
    app.querySelectorAll("[data-price]").forEach(inp=>{
      const id=inp.dataset.price, v=Number(inp.value);
      if(!isNaN(v)&&v>=0){ S.overrides[id]=S.overrides[id]||{}; S.overrides[id].price=v; }
    });
    app.querySelectorAll("[data-active]").forEach(inp=>{
      const id=inp.dataset.active; S.overrides[id]=S.overrides[id]||{}; S.overrides[id].active=inp.checked;
    });
    app.querySelectorAll("[data-note]").forEach(t=>{
      const id=t.dataset.note; S.overrides[id]=S.overrides[id]||{}; S.overrides[id].ownerNote=t.value.trim();
    });
    persist(); render();
    toast(Store.persistent?"저장했습니다":"적용했습니다 (이 환경은 새로고침 시 초기화)");
  });
  app.querySelectorAll("[data-import]").forEach(b=>b.onclick=()=>{
    try{
      const o=JSON.parse($("#a-json").value);
      S=Object.assign({},DEFAULT_SETTINGS,o); S.overrides=S.overrides||{};
      persist(); render(); toast("불러왔습니다");
    }catch(e){ toast("형식이 올바르지 않습니다"); }
  });
  app.querySelectorAll("[data-download]").forEach(b=>b.onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="stair-설정-"+new Date().toISOString().slice(0,10)+".json";
    a.click(); URL.revokeObjectURL(a.href); toast("파일로 저장했습니다");
  });
  app.querySelectorAll("[data-reset-all]").forEach(b=>b.onclick=()=>{
    if(confirm("모든 설정을 처음 상태로 되돌립니다. 계속할까요?")){
      S=JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); persist(); render(); toast("초기화했습니다");
    }
  });
}

/* 키오스크 유휴 복귀 */
let idleT=null;
function resetIdle(){
  clearTimeout(idleT);
  if(!S.idleReset || state.view==="admin") return;
  idleT=setTimeout(()=>{
    if(state.view!=="home"||state.cart.length){ state.cart=[]; state.draft=null; state.order=null; go("home"); }
  }, S.idleSec*1000);
}
["click","touchstart","keydown","scroll"].forEach(e=>
  document.addEventListener(e,resetIdle,{passive:true}));

/* ═══════════════════════════════════════════════════════════════════════
   ⑦  시 작
   ═══════════════════════════════════════════════════════════════════════ */
render();
resetIdle();
</script>
</body>
</html>
